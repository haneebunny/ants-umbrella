name: ML Ablation Experiment & Validation Pipeline

on:
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch: # 수동 실험 실행

jobs:
  run-experiments:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: backend/.venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: |
        cd backend
        poetry install --no-interaction

    - name: Run Full ML Pipeline & Ablation Experiments
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        NCP_API_KEY_ID: ${{ secrets.NCP_API_KEY_ID }}
        NCP_API_KEY: ${{ secrets.NCP_API_KEY }}
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
        ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      run: |
        cd backend
        poetry run python scripts/health_check.py
