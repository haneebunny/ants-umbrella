name: Daily ESG Risk Alert Pipeline

on:
  schedule:
    # 매일 한국 시간 아침 7시 (UTC 22시)에 실행
    - cron: '0 22 * * *'
    # 매일 한국 시간 오전 10시 (UTC 1시)에 테스트용 실행
    - cron: '0 1 * * *'
    # 임시 알람 테스트용 KST 10:20 및 10:27 스케줄 (UTC 1:20 및 1:27)
    - cron: '20 1 * * *'
    - cron: '27 1 * * *'
    # KST 오후 2시 (UTC 5시)
    - cron: '0 5 * * *'
    # KST 오후 2시 30분 (UTC 5시 30분)
    - cron: '30 5 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 지원
    inputs:
      test_mode:
        description: '테스트 알림 발송 (오늘 이벤트 없어도 목업 데이터로 강제 발송)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  run-alert-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: backend/.venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: |
        cd backend
        poetry install --no-interaction

    # 1단계: 뉴스 수집 & ESG 분류 → esg_events MongoDB 저장
    - name: Collect News & ESG Classification
      continue-on-error: true
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        NCP_API_KEY_ID: ${{ secrets.NCP_API_KEY_ID }}
        NCP_API_KEY: ${{ secrets.NCP_API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        cd backend
        poetry run python scripts/collect_news.py
        poetry run python scripts/process_news_features.py

    # 2단계: 가격/거시 데이터 수집 & 피처 생성
    - name: Run Price & Macro Data Collection
      continue-on-error: true
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        NCP_API_KEY_ID: ${{ secrets.NCP_API_KEY_ID }}
        NCP_API_KEY: ${{ secrets.NCP_API_KEY }}
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
        ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      run: |
        cd backend
        poetry run python scripts/collect_macro.py
        poetry run python scripts/collect_dart.py
        poetry run python scripts/collect_price.py
        poetry run python scripts/generate_labels.py
        poetry run python scripts/add_sector.py
        poetry run python scripts/join_features.py

    # XGBoost 추론/DB 적재 — 실패해도 슬랙 알림은 계속 실행
    - name: Update MongoDB Risk Scores (XGBoost Inference)
      continue-on-error: true
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
      run: |
        cd backend
        poetry run python scripts/save_risk_scores.py

    # 슬랙 알림 — 앞 스텝 성공/실패와 무관하게 항상 실행 (if: always())
    - name: Send Slack Alert
      if: always()
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        # workflow_dispatch에서 test_mode=true 선택 시 목업 데이터로 강제 발송
        TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
      run: |
        cd backend
        if [ "$TEST_MODE" = "true" ]; then
          poetry run python scripts/slack_notifier.py --test
        else
          poetry run python scripts/slack_notifier.py
        fi
