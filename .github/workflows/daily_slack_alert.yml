name: Daily ESG Risk Alert Pipeline

on:
  schedule:
    # 매일 KST 오전 7시 41분 (UTC 22:41) — 아침 수집 후 1차 알림 발송
    - cron: '41 22 * * *'
    # 매일 KST 오후 5시 46분 (UTC 08:46) — 저녁 수집 후 변동 시 2차 알림 발송
    - cron: '46 8 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 지원
    inputs:
      test_mode:
        description: '테스트 알림 발송 (오늘 이벤트 없어도 목업 데이터로 강제 발송)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      alert_mode:
        description: '알림 모드 (morning=무조건 발송 / evening=변동 있을 때만 발송)'
        required: false
        default: 'morning'
        type: choice
        options:
          - 'morning'
          - 'evening'

jobs:
  run-alert-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: backend/.venv
        key: ${{ runner.os }}-poetry-${{ hashFiles('backend/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: |
        cd backend
        poetry install --no-interaction

    # 1단계: 뉴스 수집 & ESG 분류 → esg_events MongoDB 저장
    - name: Collect News & ESG Classification
      continue-on-error: true
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        NCP_API_KEY_ID: ${{ secrets.NCP_API_KEY_ID }}
        NCP_API_KEY: ${{ secrets.NCP_API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      run: |
        cd backend
        poetry run python scripts/collect_news.py
        poetry run python scripts/process_news_features.py

    # 2단계: 가격/거시 데이터 수집 & 피처 생성
    - name: Run Price & Macro Data Collection
      continue-on-error: true
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        NCP_API_KEY_ID: ${{ secrets.NCP_API_KEY_ID }}
        NCP_API_KEY: ${{ secrets.NCP_API_KEY }}
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
        ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
        KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      run: |
        cd backend
        poetry run python scripts/collect_macro.py
        poetry run python scripts/collect_dart.py
        poetry run python scripts/collect_price.py
        poetry run python scripts/generate_labels.py
        poetry run python scripts/add_sector.py
        poetry run python scripts/join_features.py

    # XGBoost 추론/DB 적재 — 실패해도 슬랙 알림은 계속 실행
    - name: Update MongoDB Risk Scores (XGBoost Inference)
      continue-on-error: true
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
      run: |
        cd backend
        poetry run python scripts/save_risk_scores.py

    # 슬랙 알림 결정
    # - 오전 7:41 배치(UTC 22:41): ALERT_MODE=morning → 항상 발송
    # - 오후 5:46 배치(UTC 08:46): ALERT_MODE=evening → 오전 대비 변동 있을 때만 발송
    - name: Determine Alert Mode
      id: alert_mode
      run: |
        HOUR_UTC=$(date -u +%H)
        MINUTE_UTC=$(date -u +%M)
        echo "UTC hour: $HOUR_UTC, minute: $MINUTE_UTC"
        # workflow_dispatch에서 수동 지정된 값 우선
        if [ -n "${{ github.event.inputs.alert_mode }}" ]; then
          echo "mode=${{ github.event.inputs.alert_mode }}" >> $GITHUB_OUTPUT
        elif [ "$HOUR_UTC" -ge 22 ] || [ "$HOUR_UTC" -lt 2 ]; then
          # UTC 22~01시 = KST 07~10시 → 아침 배치
          echo "mode=morning" >> $GITHUB_OUTPUT
        else
          # 나머지 시간대 = 저녁 배치
          echo "mode=evening" >> $GITHUB_OUTPUT
        fi

    - name: Send Slack Alert
      if: always()
      env:
        MONGODB_URI: ${{ secrets.MONGODB_URI }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        ALERT_MODE: ${{ steps.alert_mode.outputs.mode }}
      run: |
        cd backend
        if [ "$TEST_MODE" = "true" ]; then
          poetry run python scripts/slack_notifier.py --test
        else
          poetry run python scripts/slack_notifier.py
        fi
